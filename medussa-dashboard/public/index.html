<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medu$$a-365</title>
    <!-- Keep Lucide Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.344.0/font/lucide.min.css" />
    <style>
        /* ── reset & root ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            /* Professional Dark Theme Matching Image */
            --black: #0f172a;       /* slate-900 */
            --surface: #1e293b;     /* slate-800 */
            --surface2: #334155;    /* slate-700 */
            --red: #10b981;         /* emerald-500 */
            --darkred: #047857;     /* emerald-700 */
            --glow: #34d399;        /* emerald-400 */
            --purple: #a855f7;      /* purple accent for icons */
            --text: #f8fafc;        /* slate-50 */
            --muted: #94a3b8;       /* slate-400 */
            --border: #334155;
            --radius: 8px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --transition: 0.2s ease;
        }
        html, body {
            height: 100%;
            background: var(--black);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--darkred); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--red); }
        .hidden { display: none !important; }

        /* ── auth ── */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1e293b, #0f172a);
        }
        .auth-card {
            background: var(--surface);
            padding: 36px 32px 40px;
            border-radius: var(--radius);
            border: 1px solid var(--darkred);
            width: 380px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .auth-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--red);
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        .auth-card input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            outline: none;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border var(--transition), box-shadow var(--transition);
        }
        .auth-card input:focus {
            border-color: var(--red);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }
        .auth-card button {
            width: 100%;
            background: var(--red);
            color: #fff;
            border: none;
            padding: 13px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            transition: background var(--transition), box-shadow var(--transition);
            font-size: 0.95rem;
        }
        .auth-card button:hover {
            background: var(--glow);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* ── dashboard layout ── */
        .dashboard {
            display: flex;
            height: 100vh;
            background: var(--black);
        }

        /* ── sidebar ── */
        .sidebar {
            width: 240px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            flex-shrink: 0;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--red);
            letter-spacing: 1px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .logo .lucide { width: 28px; height: 28px; stroke-width: 2.5; }
        .nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            transition: all var(--transition);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            border-left: 3px solid transparent;
        }
        .nav-item .lucide { width: 18px; height: 18px; stroke-width: 2; flex-shrink: 0; }
        .nav-item:hover {
            color: var(--text);
            background: var(--surface2);
        }
        .nav-item.active {
            color: var(--text);
            background: var(--surface2);
            border-left-color: var(--red);
        }
        .nav-item .badge {
            margin-left: auto;
            background: var(--darkred);
            color: #fff;
            font-size: 0.7rem;
            padding: 1px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar-footer button {
            width: 100%;
            background: var(--red);
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 6px;
            transition: background var(--transition);
            font-size: 0.8rem;
        }
        .sidebar-footer button:hover {
            background: var(--glow);
        }
        .sidebar-footer .version {
            text-align: center;
            color: var(--muted);
            font-size: 0.7rem;
            opacity: 0.5;
        }

        /* ── content ── */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 32px;
            background: var(--black);
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: var(--radius);
        }
        .topbar h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .topbar h2 span {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 400;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .search-box {
            position: relative;
            background: var(--surface2);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .search-box input {
            background: transparent;
            border: none;
            color: var(--text);
            padding: 8px 12px 8px 36px;
            outline: none;
        }
        .search-box .lucide {
            position: absolute;
            left: 10px;
            top: 8px;
            color: var(--muted);
            width: 16px;
            height: 16px;
        }
        .btn-primary {
            background: var(--red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary:hover { background: var(--glow); }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            position: relative;
        }
        .icon-btn:hover { color: var(--text); }
        .icon-btn .lucide { width: 18px; height: 18px; }
        .icon-btn .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 10px;
        }

        /* ── cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: border var(--transition);
        }
        .card:hover { border-color: var(--darkred); }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .card-title {
            color: var(--text);
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .lucide { color: var(--purple); }
        .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .card-actions button {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition);
        }
        .card-actions button:hover {
            background: var(--darkred);
            color: #fff;
            border-color: var(--red);
        }

        /* ── stats grid ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .stat-card:hover { border-color: var(--darkred); }
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
        }
        .stat-icon .lucide { width: 22px; height: 22px; }
        .stat-percent {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
        .stat-percent.positive { background: rgba(16, 185, 129, 0.1); color: var(--red); }
        .stat-info .label { color: var(--muted); font-size: 0.8rem; }
        .stat-info .value { font-size: 2rem; font-weight: 700; line-height: 1.2; }
        .stat-footer {
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* ── toggle switch ── */
        .toggle {
            width: 44px;
            height: 24px;
            background: var(--surface2);
            border-radius: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            position: relative;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .toggle.active {
            background: var(--red);
            border-color: var(--red);
        }
        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            transition: all var(--transition);
        }
        .toggle.active::after { left: 22px; }

        /* ── tables ── */
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        th {
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
        }
        tr:hover td { background: rgba(51, 65, 85, 0.2); }
        td .actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .btn-icon {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
        }
        .btn-icon:hover { color: var(--text); background: var(--surface2); }
        .btn-icon.copy:hover { color: var(--red); }
        .btn-icon.delete:hover { color: #ef4444; }
        .btn-icon .lucide { width: 14px; height: 14px; }

        /* ── empty state ── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 8px;
        }
        .empty-state .lucide {
            width: 48px;
            height: 48px;
            stroke-width: 1.5;
            color: var(--darkred);
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ── chart placeholder ── */
        .chart-placeholder {
            height: 250px;
            background: linear-gradient(to bottom, rgba(16, 185, 129, 0.1), transparent);
            border: 1px solid var(--border);
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 20px;
        }
        .chart-bar {
            width: 10%;
            background: var(--darkred);
            border-radius: 4px 4px 0 0;
            opacity: 0.8;
        }

        /* ── toast ── */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
        }
        .toast {
            background: var(--surface);
            border: 1px solid var(--darkred);
            border-radius: var(--radius);
            padding: 12px 20px;
            color: var(--text);
            font-size: 0.85rem;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 200px;
        }
        .toast .lucide { width: 18px; height: 18px; color: var(--red); }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ─── AUTH ─── -->
    <div id="auth-container" class="auth-container">
        <!-- Register -->
        <div id="register-card" class="auth-card hidden">
            <h1 class="auth-title">Medu$$a-365</h1>
            <input type="text" id="reg-username" placeholder="Username" />
            <input type="email" id="reg-email" placeholder="Email" />
            <input type="password" id="reg-password" placeholder="Password" />
            <button id="register-btn">Register</button>
            <p id="register-error" class="error" style="color:#ef4444; margin-top:10px;"></p>
            <p class="auth-link" style="margin-top:16px; color:#94a3b8;"><a href="#" id="go-to-login" style="color:#10b981;">Already have an account? Login</a></p>
        </div>
        <!-- Login -->
        <div id="login-card" class="auth-card hidden">
            <h1 class="auth-title">Medu$$a-365</h1>
            <input type="text" id="login-username" placeholder="Username" />
            <input type="password" id="login-password" placeholder="Password" />
            <button id="login-btn">Login</button>
            <p id="login-error" class="error" style="color:#ef4444; margin-top:10px;"></p>
        </div>
    </div>

    <!-- ─── DASHBOARD ─── -->
    <div id="dashboard" class="dashboard hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="lucide lucide-skull"></i>
                <span>Medu$$a-365</span>
            </div>
            <nav class="nav">
                <a href="#" class="nav-item active" data-page="overview">
                    <i class="lucide lucide-layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-page="credentials">
                    <i class="lucide lucide-user"></i>
                    <span>Custom Logins</span>
                    <span class="badge" id="badge-creds">0</span>
                </a>
                <a href="#" class="nav-item" data-page="settings">
                    <i class="lucide lucide-settings"></i>
                    <span>Settings</span>
                </a>
                <a href="#" class="nav-item" data-page="history">
                    <i class="lucide lucide-wrench"></i>
                    <span>Developers</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn">Logout</button>
                <div class="version">v2.0</div>
            </div>
        </aside>

        <!-- Content -->
        <main class="content">
            <header class="topbar">
                <h2>Dashboard <span>Dashboard, State, Login</span></h2>
                <div class="topbar-actions">
                    <div class="search-box">
                        <i class="lucide lucide-search"></i>
                        <input type="text" placeholder="Search..." />
                    </div>
                    <button class="btn-primary">Start 30 Day Trial</button>
                    <button class="icon-btn"><i class="lucide lucide-refresh-cw"></i></button>
                    <div class="topbar-text" style="color:#94a3b8; font-size:0.9rem;">10 Users</div>
                    <button class="icon-btn">
                        <i class="lucide lucide-bell"></i>
                        <span class="badge">1</span>
                    </button>
                </div>
            </header>

            <div id="page-content" class="page-content" style="display:flex; flex-direction:column; gap:20px;"></div>
        </main>
    </div>

    <!-- ─── TOAST CONTAINER ─── -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // ... (Keep all your original JavaScript functions exactly as they are)
        // BUT, rewrite the `loadOverview` function to match the new HTML structure below.
        // I have provided the new `loadOverview` function here for you to replace:

        async function loadOverview() {
            try {
                const stats = await fetchWithAuth('/api/stats');
                const sessions = await fetchWithAuth('/api/sessions');
                allSessions = sessions;
                updateBadges(stats);

                pageContent.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-header">
                                <div class="stat-icon"><i class="lucide lucide-user"></i></div>
                                <span class="stat-percent positive">+13%</span>
                            </div>
                            <div class="stat-info">
                                <div class="label">Unique Users</div>
                                <div class="value">${stats.sessions}</div>
                            </div>
                            <div class="stat-footer">Unique visitors</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-header">
                                <div class="stat-icon" style="color:#ef4444;"><i class="lucide lucide-alert-triangle"></i></div>
                                <span class="stat-percent positive">+16%</span>
                            </div>
                            <div class="stat-info">
                                <div class="label">Failed Logins</div>
                                <div class="value">${stats.credentials}</div>
                            </div>
                            <div class="stat-footer">Unique visitors</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-header">
                                <div class="stat-icon"><i class="lucide lucide-check-circle"></i></div>
                                <span class="stat-percent positive">0%</span>
                            </div>
                            <div class="stat-info">
                                <div class="label">Success Logins</div>
                                <div class="value">${stats.cookies}</div>
                            </div>
                            <div class="stat-footer">Unique visitors</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-header">
                                <div class="stat-header">
                                    <div style="display:flex; gap:8px; align-items:center;">
                                        <div class="stat-icon" style="background:#78350f; color:#fbbf24;"><i class="lucide lucide-link"></i></div>
                                        <div>
                                            <div class="label">Black URL</div>
                                            <div class="stat-info" style="font-size:0.8rem; color:var(--muted);">Auto Sold</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                                <span style="font-size:0.8rem; color:var(--muted);">Auto Sold</span>
                                <div class="toggle active" onclick="this.classList.toggle('active')"></div>
                            </div>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns: 2fr 1fr; gap:20px;">
                        <div class="card">
                            <div class="card-header">
                                <div class="card-title">Visitors Last 7 Days</div>
                                <div class="card-actions"><button>Last 7 days <i class="lucide lucide-chevron-down"></i></button></div>
                            </div>
                            <div class="chart-placeholder">
                                <div class="chart-bar" style="height:40%;"></div>
                                <div class="chart-bar" style="height:55%;"></div>
                                <div class="chart-bar" style="height:30%;"></div>
                                <div class="chart-bar" style="height:80%;"></div>
                                <div class="chart-bar" style="height:60%;"></div>
                                <div class="chart-bar" style="height:90%;"></div>
                                <div class="chart-bar" style="height:70%;"></div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <div class="card-title">Top Countries</div>
                            </div>
                            <div class="empty-state" style="height:250px; display:flex; flex-direction:column; justify-content:center;">
                                <i class="lucide lucide-globe"></i>
                                <p>No data yet</p>
                            </div>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                        <div class="card">
                            <div class="card-header">
                                <div class="card-title">Recent Logins Captured</div>
                                <div class="card-actions"><button>View all</button></div>
                            </div>
                            <div class="table-wrap">
                                <table>
                                    <thead><tr><th>Country</th><th>IP</th><th>Date</th><th>Status</th></tr></thead>
                                    <tbody>
                                        ${sessions.slice(0,5).map(s => `
                                            <tr>
                                                <td>${s.geo ? escapeHtml(s.geo.country||'') : '-'}</td>
                                                <td>${escapeHtml(s.ip || '-')}</td>
                                                <td>${formatDate(s.updated_at)}</td>
                                                <td>${escapeHtml(s.status || '-')}</td>
                                            </tr>
                                        `).join('')}
                                        ${sessions.length === 0 ? `<tr><td colspan="4" style="text-align:center;padding:20px; color:var(--muted);">No data available</td></tr>` : ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header">
                                <div class="card-title">Recent Visitors</div>
                                <div class="card-actions"><button>View all</button></div>
                            </div>
                            <div class="table-wrap">
                                <table>
                                    <thead><tr><th>IP Address</th><th>Country</th><th>Status</th></tr></thead>
                                    <tbody>
                                        ${sessions.slice(0,5).map(s => `
                                            <tr>
                                                <td>${escapeHtml(s.ip || '-')}</td>
                                                <td>${s.geo ? escapeHtml(s.geo.country||'') : '-'}</td>
                                                <td>${escapeHtml(s.status || '-')}</td>
                                            </tr>
                                        `).join('')}
                                        ${sessions.length === 0 ? `<tr><td colspan="3" style="text-align:center;padding:20px; color:var(--muted);">No data available</td></tr>` : ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            } catch (e) { console.error(e); }
